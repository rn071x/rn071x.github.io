<body>

    <a href="#top" class="logo">TRACE</a>

    <nav class="nav" id="nav">

      <span></span>
      <span></span>

<!-- ========== Hero ========== -->
<section class="hero" id="top">
  <h1 class="hero-title">TRACE</h1>
  <p class="hero-sub">Photography / Works / Notes</p>
</section>

<!-- ========== Works ==========
  今は全点を .work-featured(非対称・トリミングなしグリッド)の2点1組で並べている。
  作品数が増えてきたら、後半を .work-strip(横スクロールのフィルムストリップ)に
  切り替える方針。.work-strip のスタイルは一旦styles.cssから外してあるので、
  再導入するときは書き直すこと。
  タイトルは表示しない方針(写真のみ)。alt属性には内容の説明を入れる。
  data-category は表示には使っていないが、将来ジャンル別に
  絞り込み表示を追加したくなったときのための目印として残している。
-->
<section class="works" id="works">
  <h2 class="section-label">Works</h2>

  <div class="work-featured">

    <article class="work-item" data-category="photography">
      <div class="work-image">
        <img src="images/01.JPG" alt="河岸">
      </div>
    </article>

    <article class="work-item" data-category="photography">
      <div class="work-image">
        <img src="images/02.jpg" alt="雲海と夕景">
      </div>
    </article>

  </div>

  <div class="work-featured work-featured--reverse">

    <article class="work-item" data-category="photography">
      <div class="work-image">
        <img src="images/04.jpg" alt="車体のクローズアップ">
      </div>
    </article>

    <article class="work-item" data-category="photography">
      <div class="work-image">
        <img src="images/03.jpg" alt="木々と水面">
      </div>
    </article>

  </div>

  <div class="work-featured work-featured--solo">

    <article class="work-item" data-category="photography">
      <div class="work-image">
        <img src="images/05.jpg" alt="木漏れ日の森">
      </div>
    </article>

  </div>

  <div class="work-featured work-featured--even">

    <article class="work-item" data-category="photography">
      <div class="work-image">
        <img src="images/06.jpg" alt="森の中の小さな堰">
      </div>
    </article>

    <article class="work-item" data-category="photography">
      <div class="work-image">
        <img src="images/07.jpg" alt="保安林の標識">
      </div>
    </article>

  </div>
</section>

<!-- ========== About ========== -->
<section class="about" id="about">
  <h2 class="section-label">About</h2>
  <div class="about-body">
    <div class="about-photo">
      <img src="images/myimage.jpg" alt="プロフィール写真">
    </div>
    <p class="about-text">
      岩手を拠点に活動。佇まいを淑やかに魅せることに興味があります。<br>
      その時惹かれた何かを、編成、編集するのが好きです。<br>
      <br>
      Drawn to what catches my eye.
    </p>
  </div>
</section>

<!-- ========== Contact ========== -->
<section class="contact" id="contact">
  <h2 class="section-label">Contact</h2>
  <ul class="contact-list">
    <li><a href="mailto:rn071.work@gmail.com">rn071.work@gmail.com</a></li>
    <li><a href="https://instagram.com/rn071xx" target="_blank" rel="noopener">Instagram</a></li>
  </ul>
</section>

<footer class="site-footer">

  <span class="footer-copy">&copy; 2026 TRACE</span>
</footer>

</body>
</html>
